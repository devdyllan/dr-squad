# DR Squad — Asset Registry
# ============================================================
# IMPORTANT: This file contains NO real credentials, passwords,
# tokens, or personally identifiable information.
# Asset aliases are used throughout. Actual credentials are
# stored in the approved secrets manager ONLY — never here.
# ============================================================
# Schema version: 1.0
# Maintained by: Contingency Chief (entries require CEO Agent
# authorization for new assets; human owner approval for any
# action that changes ACTIVE assets)
# Access policy: governance/access-control-policy.md
# ============================================================

schema:
  asset_id:
    type: string
    description: "Unique alias. Format: TYPE_REGION_NN. No real names, emails, or usernames."
  type:
    type: string
    enum:
      - BUSINESS_MANAGER
      - AD_ACCOUNT
      - FB_PAGE
      - IG_PROFILE
      - FB_PROFILE
      - EMAIL_ACCOUNT
      - BROWSER_PROFILE
      - DOMAIN
      - PIXEL
  status:
    type: string
    enum:
      - WARMING       # In warm-up protocol; not yet operational
      - READY         # Warm-up complete; available for activation
      - ACTIVE        # Deployed in live operations
      - ISOLATED      # Flagged or suspended; removed from ready pool
      - RETIRED       # Permanently decommissioned
  region:
    type: string
    description: "Operational region code. e.g., US, CA, UK, AU"
  platform:
    type: string
    description: "Platform this asset belongs to. e.g., META, GOOGLE, TIKTOK, EMAIL, BROWSER, DNS"
  allowed_actions:
    type: list
    description: "Explicit list of authorized actions for this asset. Executors may only perform actions on this list."
  risk_level:
    type: string
    enum:
      - LOW     # No flags; no restrictions; full trust signal
      - MEDIUM  # Minor historical flag or new/thin trust; monitor
      - HIGH    # Recent policy warning or restriction; restricted use
  notes:
    type: string
    description: "Operational notes. Warm-up progress, risk context, last verified date. No credentials here."

# ============================================================
